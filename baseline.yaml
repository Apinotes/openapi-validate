openapi: 3.2.0
$self: https://api.example.com/openapi.yaml
info:
  title: Watcher Sample API
  version: 2.0.0
  description: Copy of baseline.yaml with every breaking change the watcher diff engine detects.
servers:
  - url: https://api.example.com/v1
    name: prod
    description: Production
  # api-server-removed: the eu server is gone
tags:
  - name: users
    kind: nav
  - name: orders
    kind: nav
security:
  # security-requirement-added + security-scope-added (write scope on apiKeyAuth)
  - apiKeyAuth:
      - write
  - oauth2:
      - read
paths:
  /users:
    get:
      # api-operation-id-removed: operationId dropped
      # api-tag-removed: users tag dropped
      summary: List users
      parameters:
        # request-parameter-became-required: limit now required
        # request-property-maximum-decreased: maximum 100 -> 50
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            maximum: 50
        # request-parameter-removed (optional -> warn): legacyFilter gone
        # request-parameter-allow-empty-value-removed: emptyOk loses allowEmptyValue
        - name: emptyOk
          in: query
          allowEmptyValue: false
          schema:
            type: string
        # request-parameter-style-changed + request-property-enum-value-removed (desc gone)
        - name: sort
          in: query
          style: spaceDelimited
          schema:
            type: string
            enum:
              - asc
        # new-required-request-parameter: brand new required param
        - name: tenant
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          headers:
            # response-required-header-removed: X-Rate-Limit gone
            # response-header-became-optional: X-Trace no longer required
            X-Trace:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                # response-required-property-removed: legacy dropped from required + properties
                required:
                  - id
                  - name
                properties:
                  # response-property-type-changed: string -> integer
                  id:
                    type: integer
                  # response-property-max-length-removed: maxLength loosened
                  name:
                    type: string
                  # response-property-became-nullable: false -> true
                  score:
                    type: number
                    nullable: true
                  # response-property-format-changed: date-time -> date
                  createdAt:
                    type: string
                    format: date
                  # response-property-enum-value-removed (banned) + enum-value-added (suspended)
                  status:
                    type: string
                    enum:
                      - active
                      - suspended
                  # array-items-schema-removed (response)
                  list:
                    type: array
                  # response-body-oneOf-added: variant gains a oneOf
                  variant:
                    oneOf:
                      - type: string
                      - type: integer
            # response-media-type-removed: application/xml gone
        '404':
          description: Not Found
    post:
      operationId: createUser
      tags:
        - users
      summary: Create user
      # request-body-became-required: required false -> true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # request-property-became-required (email) + new-required-request-property (token)
              required:
                - name
                - email
                - token
              properties:
                # request-property-max-length-decreased: 50 -> 30
                name:
                  type: string
                  maxLength: 30
                email:
                  type: string
                token:
                  type: string
                # request-property-type-changed: integer -> string
                age:
                  type: string
                # request-property-enum-value-removed: admin gone
                role:
                  type: string
                  enum:
                    - user
                # request-property-became-not-nullable: true -> false
                nickname:
                  type: string
                  nullable: false
                # request-property-pattern-added
                code:
                  type: string
                  pattern: '^[A-Z]{3}$'
                # request-property-minimum-set (tightened)
                qty:
                  type: integer
                  minimum: 1
                # array-items-schema-added (request)
                tags:
                  type: array
                  items:
                    type: string
                # additional-properties-removed (request)
                meta:
                  type: object
                  additionalProperties: false
          # request-body-media-type-removed: form urlencoded gone
      responses:
        # response-success-status-removed: 200 gone
        '201':
          description: Created
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Not Found
    put:
      operationId: replaceUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      # request-body-removed: the whole body is gone
      responses:
        '200':
          description: OK
  # /legacy removed -> api-removed-without-deprecation
  # /legacy-deprecated removed -> api-removed-with-deprecation
  /orders:
    get:
      # api-deprecated: endpoint now deprecated
      deprecated: true
      operationId: listOrders
      tags:
        - orders
      summary: List orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /reports:
    post:
      operationId: createReport
      summary: Create report
      # request-body-added-required: brand new required body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        '201':
          description: Created
components:
  securitySchemes:
    # security-scheme-in-changed (header -> query) + security-scheme-param-name-changed
    apiKeyAuth:
      type: apiKey
      in: query
      name: api_key
    # security-scheme-scheme-changed (basic -> bearer)
    basicAuth:
      type: http
      scheme: bearer
    # security-scheme-type-changed (http -> apiKey)
    tokenAuth:
      type: apiKey
      in: header
      name: X-Token
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          # security-scheme-oauth-authorization-url-changed
          authorizationUrl: https://auth.example.com/oauth/authorize
          # security-scheme-oauth-token-url-changed
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            read: Read access
            # security-scheme-oauth-scope-removed: write gone
        # security-scheme-oauth-flow-removed: implicit flow gone
    # security-scheme-removed: legacyAuth gone
  schemas:
    Order:
      type: object
      # component-schema property-removed/required-removed/type-changed (null direction)
      # response-required-property-removed where referenced (response direction)
      required:
        - orderId
      properties:
        # type-changed: string -> integer
        orderId:
          type: integer
        # total removed entirely (was required)
        status:
          type: string
          # enum value removed: shipped gone
          enum:
            - open
            - closed
        note:
          type: string
    Catalog:
      type: object
      required:
        - sku
        - price
      properties:
        sku:
          type: string
        # schema-minimum-changed (tightened): 0 -> 10
        price:
          type: number
          minimum: 10
        # label property-removed
    Shape:
      # schema-discriminator-changed: propertyName shapeType -> kind
      oneOf:
        - type: object
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - circle
            radius:
              type: number
        - type: object
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - square
            side:
              type: number
      discriminator:
        propertyName: kind
    Bundle:
      # schema-allOf-removed: allOf dropped
      type: object
      properties:
        sku:
          type: string
    # LegacySchema removed -> component-schema-removed
